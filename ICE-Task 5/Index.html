<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm</title>
    <link rel="stylesheet" href="Style.css">
    <script src="JavaScript.js"></script>
</head>
<body>
    <div class="div-wrap">
        <H2 class="div-wrap-heading">Alarm -- HTML/CSS/JAVASCRIPT</H2>
        <P class="div-wrap-text">This an alarm created using HTML, CSS, JAVASCRIPT</P>
        <div class="clock">
            <div class="datetime-display">00:00:00 PM</div>
        </div>
      <nav class="grid">
        <div class="card">
            <label for="datetime">Set alarm (date & time)</label>
            <input id="datetime" type="datetime-local">
            <div class="controls">
                <button id="SetAlarmbtn" class="primary">Set Alarm</button>
                <button id="ClearAlarmbtn" class="ghost">Clear Alarm</button>
            </div>
            <div class="status">
                <div>Timer: <span id="timerLabel">Idle</span></div>
                <div class="time-preview" id="timerRemaining">00:00:00</div>
            </div>
        </div>
        <div class="card">
              <label for="minutes">Countdown timer (minutes)</label>
        <input id="minutes" type="number" min="1" placeholder="0">
        <div class="controls">
          <button id="setTimerBtn" class="primary">Start Timer</button>
          <button id="stopBtn" class="ghost">Stop</button>
        </div>
        <div class="status">
          <div>Timer: <span id="timerLabel">idle</span></div>
          <div class="time-preview" id="timerRemaining">00:00:00</div>
        </div>

        </div>
      </div> 
       <div class="ring" id="ring">
        <button id="snoozeBtn" class="ghost">Snooze 5 min</button>
        <button id="stopSoundBtn" class="primary">Stop Sound</button>
        </div>  
    </div>
</body>
</html>
